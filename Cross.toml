# Forwards the NEON compiler flags xtask sets (see build_release_pi in
# xtask/src/main.rs) into the cross container, so the bundled C/C++ builds
# (Opus via audiopus_sys, DuckDB via libduckdb-sys) match the `+neon`
# target-feature set in .cargo/config.toml for armv7-unknown-linux-musleabihf.
[build.env]
passthrough = [
    "CFLAGS_armv7_unknown_linux_musleabihf",
    "CXXFLAGS_armv7_unknown_linux_musleabihf",
]
