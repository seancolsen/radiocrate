# Custom build image for armv7-unknown-linux-gnueabihf: Debian Bookworm-based
# (matching Raspberry Pi OS's own glibc, 2.36) instead of cross-rs's default
# Ubuntu-based image, whose newer glibc produces binaries that fail to run on
# the Pi. See docker/cross-armv7-gnueabihf.Dockerfile and DEVELOPMENT.md.
[target.armv7-unknown-linux-gnueabihf]
dockerfile = "docker/cross-armv7-gnueabihf.Dockerfile"
