[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "radiocrate-server"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
api-schema = { path = "../api-schema" }
introspection = { path = "../introspection" }
arrow-ipc = "58"
axum = "0.8"
blake3 = "1"
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
# `json`: statically compiles DuckDB's JSON extension into the bundled build
# (introspection's SQL uses to_json/json_object). Without it, DuckDB falls
# back to autoloading the extension over the network at query time, which
# fails outright on 32-bit ARM (DuckDB doesn't publish extension binaries for
# that platform) and is undesirable anywhere for a self-hosted app regardless.
duckdb = { version = "1.10504.0", features = ["bundled", "json"] }
jiff = "0.2"
audiopus = "0.3.0-rc.0"
ogg = "0.9"
rayon = "1"
rubato = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["all"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
uuid = { version = "1", features = ["v4"] }
