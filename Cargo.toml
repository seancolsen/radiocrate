[workspace]
members = ["backend", "radiocrate", "introspection", "xtask", "api-schema"]
resolver = "3"
default-members = ["backend"]

# Compile the bundled DuckDB C++ with optimizations even in debug builds.
# `libduckdb-sys` builds DuckDB via the `cc` crate, which follows Cargo's
# OPT_LEVEL. Without this, a debug build compiles DuckDB at -O0, making
# compute-heavy queries ~10x slower than a release build (and than the DuckDB
# CLI). Scoping the override to this crate keeps our own Rust at -O0 for fast
# iterative compiles.
[profile.dev.package.libduckdb-sys]
opt-level = 3

# Used for the Raspberry Pi home-lab deployment build (see `cargo xtask
# build-release-pi` and DEVELOPMENT.md). Separate from `release` so ordinary
# x86 release builds stay on the fast/default settings; this profile trades
# link time for a smaller, faster binary — worthwhile since it's built rarely,
# not on every iteration.
#
# `panic = "abort"` is deliberately NOT set here: it would remove per-task
# unwind isolation in the axum/tokio server, turning an isolated request panic
# into a whole-process crash.
[profile.release-pi]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
