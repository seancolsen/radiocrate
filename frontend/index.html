<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>RadioCrate</title>
    <meta name="description" content="Manage and play your audio collection." />

    <!--
      Everything below is host-relative on purpose. RadioCrate is self-hosted and
      every installation is on a different domain, so the manifest, the service
      worker scope and the icons must never name one.
    -->
    <!--
      `use-credentials` matters whenever RadioCrate sits behind cookie-based auth
      (Cloudflare Access, Authelia, an oauth2-proxy). Unlike every other subresource
      here, the manifest is fetched with credentials *omitted* by default, so the
      session cookie doesn't go with it: the auth layer sees an unauthenticated
      request, redirects to its login page on another origin, and the browser
      rejects that as a CORS failure. No manifest, no install prompt. Sending
      credentials costs nothing when there's no auth in front — the request is
      same-origin either way.
    -->
    <link
      rel="manifest"
      href="/manifest.webmanifest"
      crossorigin="use-credentials"
    />
    <link rel="icon" href="/icons/icon-32.png" sizes="32x32" />
    <link rel="icon" href="/icons/icon-16.png" sizes="16x16" />
    <link rel="icon" href="/icons/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Standalone display. The first is the modern spelling, the second the one
         iOS still reads. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="RadioCrate" />
    <!--
      `default` rather than `black-translucent`: it lets iOS pick a legible status
      bar for the system appearance. Under `black-translucent` the status bar
      follows the *system* theme while the app follows its own stored preference,
      so overriding the theme to the opposite of the system can leave the clock
      unreadable against our own background.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Tints the Android status bar / desktop title bar to match the surface the
         app paints under it. Kept in sync with a forced theme by the bootstrap
         script below. -->
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#f8f8f8"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#1b1b1b"
      media="(prefers-color-scheme: dark)"
    />

    <script>
      // Runs before first paint so a forced theme never flashes the other one's
      // background. Mirrors the app's stored-preference read.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          if (stored === "light" || stored === "dark") {
            document.documentElement.setAttribute("data-theme", stored);
            var meta = document.createElement("meta");
            meta.name = "theme-color";
            meta.content = stored === "dark" ? "#1b1b1b" : "#f8f8f8";
            document.head.appendChild(meta);
          }
        } catch (e) {
          // Private-mode localStorage denial. Falling back to the system
          // preference is what the app itself does too.
        }
      })();
    </script>
