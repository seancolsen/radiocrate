- dialog "Delete album":
    - heading "Delete album" [level=2]
    - button "Close":
        - img
    - paragraph: This can’t be undone.
    - paragraph: "Other records are tied to it:"
    - list:
        - listitem:
            - text: Delete 9 tracks Otherwise they’re kept, with no album.
            - checkbox "Delete 9 tracks" [checked]
            - list:
                - listitem:
                    - text: Delete 10 credits A credit can’t be kept without its track.
                    - checkbox "Delete 10 credits" [checked] [disabled]
                    - list:
                        - listitem:
                            - text: Delete 2 artists They would be left with no credits.
                            - checkbox "Delete 2 artists"
                - listitem:
                    - text: Delete 594 plays A play can’t be kept without its track.
                    - checkbox "Delete 594 plays" [checked] [disabled]
                - listitem:
                    - text: Delete 32 track tags A track tag can’t be kept without its track.
                    - checkbox "Delete 32 track tags" [checked] [disabled]
                    - list:
                        - listitem:
                            - text: Delete 3 tags They would be left with no track tags.
                            - checkbox "Delete 3 tags"
                - listitem:
                    - text: Delete 9 file records They would be left with no tracks.
                    - checkbox "Delete 9 file records"
    - paragraph: In all, 646 records will be deleted.
    - button "Cancel"
    - button "Delete"
