<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>RadioCrate (React)</title>
    <!--
      The React port's app entry (see specs/2026-09-react-migration/plan.md).
      Dev-only: `vite build` takes index.html as its single input, so this page
      and everything it imports stay out of the production bundle. At the
      cutover it replaces index.html's <script> and this file goes away.

      Deliberately spare next to index.html: no manifest, no icons, no iOS
      launch images, no standalone-display metas. None of that reaches a
      screenshot or a behavioral spec — it's install-time metadata, and the
      cutover keeps index.html's copy of it. What *is* here is everything that
      changes a rendered pixel: the viewport, `color-scheme`, the single
      `theme-color` meta the app rewrites, and the pre-paint theme bootstrap.
    -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8f8f8" />

    <script>
      // Runs before first paint so a forced theme never flashes the other one's
      // background. Mirrors the app's stored-preference read, and points the
      // `theme-color` meta above at whichever surface wins — a stored override
      // or, absent one, the system preference. `applyThemeToDocument` in
      // `src/app/stores/app/theme.ts` keeps both in step from here on.
      (function () {
        var pref = null;
        try {
          var stored = localStorage.getItem("theme");
          if (stored === "light" || stored === "dark") pref = stored;
        } catch (e) {
          // Private-mode localStorage denial. Falling back to the system
          // preference is what the app itself does too.
        }
        if (pref) document.documentElement.setAttribute("data-theme", pref);
        var dark =
          pref === "dark" ||
          (pref === null &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = dark ? "#1b1b1b" : "#f8f8f8";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
